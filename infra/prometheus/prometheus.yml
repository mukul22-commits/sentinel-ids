global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sentinel-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: sentinel-backend

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]
        labels:
          service: promtail
