# Sentinel IDS - kustomization.
#
# Apply with:  kubectl apply -k infra/k8s
#
# The postgres-init ConfigMap is GENERATED from infra/postgres/init/*.sql so the
# TimescaleDB bootstrap stays in sync with the Docker Compose deployment.
#
# Secrets: this kustomization includes secret.example.yaml (placeholders only)
# so the tree is self-consistent and dry-runable. Real deployments MUST either
# replace the placeholder values in that Secret or switch to the generator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sentinel-ids

commonLabels:
  app.kubernetes.io/name: sentinel-ids
  app.kubernetes.io/part-of: sentinel-ids

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - worker.yaml
  - frontend.yaml
  - ingress.yaml

configMapGenerator:
  # Bootstrap SQL from the canonical source so Postgres init stays identical to
  # the Compose deployment. The generated ConfigMap is named postgres-init-<hash>
  # and kustomize rewrites the volume reference in postgres.yaml accordingly.
  - name: postgres-init
    namespace: sentinel-ids
    files:
      - 01-extensions.sql=../postgres/init/01-extensions.sql

# Real secrets must NOT live in git. Two options:
#   (a) Replace the placeholder values in secret.example.yaml with real values
#       generated by `openssl rand -base64 32` (recommended for small teams), or
#   (b) Remove "secret.example.yaml" from `resources` above, create a gitignored
#       infra/k8s/secrets.env with KEY=VALUE lines, and enable this generator:
#
# secretGenerator:
#   - name: sentinel-secrets
#     namespace: sentinel-ids
#     envs:
#       - secrets.env
#
# Note: the hashed Secret name produced by the generator is rewritten into the
# envFrom refs automatically, exactly like postgres-init above.

# Override the placeholder images for your registry, e.g.:
# images:
#   - name: sentinel-backend
#     newName: <registry>/sentinel-ids-backend
#     newTag: <ci-build-tag>
#   - name: sentinel-frontend
#     newName: <registry>/sentinel-ids-frontend
#     newTag: <ci-build-tag>
