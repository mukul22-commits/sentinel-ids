# Sentinel IDS - secret template (EXAMPLE ONLY).
#
# This file is a TEMPLATE. The values below are placeholders and MUST be
# replaced with real secrets before any deployment. Real secrets must never be
# committed to git.
#
# Two supported ways to supply real values:
#   1. Replace this file's values and apply it, or
#   2. Remove this file from kustomization.yaml `resources` and enable the
#      `secretGenerator` block there (reads from a gitignored `secrets.env`).
#
# The backend (backend.yaml) and worker (worker.yaml) consume every key here via
# envFrom -> secretRef. Keys map to pydantic-settings env vars in backend/app/core/config.py.
#
# Key reference:
#   POSTGRES_PASSWORD   - timescaledb superuser password (must match the
#                         password embedded in DATABASE_URL in configmap.yaml).
#   SECRET_KEY          - Flask/FastAPI-style app secret; also signs JWTs.
#                         Must be >= 32 chars when ENVIRONMENT=prod.
#   JWT_SECRET_KEY      - Reserved override for the JWT signing key. The current
#                         backend signs JWTs with SECRET_KEY, so leave this equal
#                         to SECRET_KEY unless a future release reads it directly.
#   SIEM_AUTH_TOKEN     - Bearer token for the ArcSight CEF collector endpoint.
#   SIEM_CEF_ENDPOINT_URL - Collector URL (SIEM_EXPORT_ENABLED must be "true").
#   HTTP_CONNECTOR_URL  - Firewall/webhook connector endpoint.
#   HTTP_CONNECTOR_TOKEN - Token for the HTTP connector.
#   EMAIL_SMTP_USERNAME / EMAIL_SMTP_PASSWORD - SMTP credentials for alerts.
#   OPNSENSE_CONNECTOR_KEY / OPNSENSE_CONNECTOR_SECRET - firewall automation.
#   EDR_CONNECTOR_TOKEN - EDR connector token.
#   OIDC_CLIENT_SECRET  - OIDC client secret when OIDC_ENABLED=true.
#
# Generate with:
#   printf '%s' "$(openssl rand -hex 32)" | base64
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel-ids
  labels:
    app.kubernetes.io/name: sentinel-ids
    app.kubernetes.io/part-of: sentinel-ids
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  SECRET_KEY: "REPLACE_ME"
  JWT_SECRET_KEY: "REPLACE_ME"
  SIEM_AUTH_TOKEN: "REPLACE_ME"
  SIEM_CEF_ENDPOINT_URL: "REPLACE_ME"
  HTTP_CONNECTOR_URL: "REPLACE_ME"
  HTTP_CONNECTOR_TOKEN: "REPLACE_ME"
  EMAIL_SMTP_USERNAME: "REPLACE_ME"
  EMAIL_SMTP_PASSWORD: "REPLACE_ME"
  OPNSENSE_CONNECTOR_KEY: "REPLACE_ME"
  OPNSENSE_CONNECTOR_SECRET: "REPLACE_ME"
  EDR_CONNECTOR_TOKEN: "REPLACE_ME"
  OIDC_CLIENT_SECRET: "REPLACE_ME"
