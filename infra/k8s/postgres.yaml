# Sentinel IDS - PostgreSQL (TimescaleDB) StatefulSet.
#
# Runs timescale/timescaledb:latest-pg16 with a dedicated PVC (postgres-data).
# The bootstrap SQL from infra/postgres/init/01-extensions.sql is mounted
# read-only at /docker-entrypoint-initdb.d and executed on first boot.
#
# The init ConfigMap named "postgres-init" is GENERATED by kustomize from
# infra/postgres/init/01-extensions.sql (see kustomization.yaml) - do not apply
# this file with plain kubectl without the kustomize build step.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sentinel-ids
  labels:
    app.kubernetes.io/name: sentinel-ids
    app.kubernetes.io/part-of: sentinel-ids
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: sentinel-ids
    spec:
      # timescale/timescaledb runs as the postgres user (uid 999).
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: sentinel-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  # Omit storageClassName to use the cluster's default StorageClass.
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sentinel-ids
  labels:
    app.kubernetes.io/name: sentinel-ids
    app.kubernetes.io/part-of: sentinel-ids
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
