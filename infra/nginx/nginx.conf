# Sentinel IDS - bare-metal / reverse-proxy deployment (Phase 12)
#
# Complete main-context nginx config for a host that runs the Sentinel stack on
# loopback ports (Compose publishes frontend :5173 and backend :8000) and fronts
# them with TLS on :80/:443.
#
#   /            -> frontend (Vite/nginx, http://127.0.0.1:5173)
#   /api/        -> backend  (FastAPI, http://127.0.0.1:8000)
#   /ws/         -> backend  (WebSocket /ws/incidents, with upgrade)
#
# Install as /etc/nginx/nginx.conf (backup the distro file first). Replace the
# cert paths and the sentinel.example.com server_name for your environment.
#
# Validate + reload:
#   nginx -t && systemctl reload nginx

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'upstream=$upstream_addr us=$upstream_status '
                    'urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;
    sendfile       on;
    tcp_nopush     on;
    keepalive_timeout  65;

    # ---- TLS (client side) -----------------------------------------------
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS - enable once TLS is verified end to end:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Compression -----------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # ---- Rate limiting ---------------------------------------------------
    # Per-IP API throttle; adjust to expected traffic.
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=20r/s;
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # ---- Upstreams -------------------------------------------------------
    upstream sentinel_frontend {
        server 127.0.0.1:5173;
        keepalive 32;
    }

    upstream sentinel_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen       80;
        listen       [::]:80;
        server_name  sentinel.example.com;

        # Redirect everything to TLS.
        return 301 https://$host$request_uri;
    }

    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  sentinel.example.com;

        # Certificates - replace with your paths (e.g. Let's Encrypt).
        ssl_certificate     /etc/letsencrypt/live/sentinel.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sentinel.example.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/sentinel.example.com/chain.pem;
        ssl_stapling       on;
        ssl_stapling_verify on;
        resolver           1.1.1.1 8.8.8.8 valid=300s;

        client_max_body_size 10m;

        # ---- Security headers (applies to every response) ----------------
        add_header X-Frame-Options           "DENY"               always;
        add_header X-Content-Type-Options    "nosniff"            always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://sentinel.example.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ---- WebSocket: /ws/incidents ------------------------------------
        location /ws/ {
            proxy_pass http://sentinel_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-lived sockets must not hit HTTP request timeouts.
            proxy_connect_timeout   10s;
            proxy_send_timeout      3600s;
            proxy_read_timeout      3600s;
        }

        # ---- API: /api/ --------------------------------------------------
        location /api/ {
            limit_req   zone=api_limit burst=40 nodelay;
            limit_conn  conn_limit 100;

            proxy_pass         http://sentinel_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout   10s;
            proxy_send_timeout      60s;
            proxy_read_timeout      60s;
        }

        # ---- SPA: everything else ----------------------------------------
        location / {
            proxy_pass http://sentinel_frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout   10s;
            proxy_send_timeout      60s;
            proxy_read_timeout      60s;
        }
    }
}
